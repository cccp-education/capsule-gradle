name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Fast Tests (PR Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fast PR gate: unit tests only — no real ffmpeg/espeak/node/Chromium.
      # functionalTest + cucumberTest require those binaries and run in the
      # `Full Tests` job which installs them. (Mirror codebase `testFast`.)
      - name: Run fast tests (unit)
        run: ./gradlew test
        working-directory: capsule-plugin
