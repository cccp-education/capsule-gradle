name: Test

on:
  push:
    branches: [main, master]
    # Governance/doc-only changes do not affect the plugin build (rule
    # "Local = Build, Tests = CI"): skip CI on pure-doc paths.
    paths-ignore:
      - '**/*.adoc'
      - '**/*.md'
      - '.agents/**'
      - '.github/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'fish_example.yaml'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.adoc'
      - '**/*.md'
      - '.agents/**'
      - '.github/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'fish_example.yaml'

jobs:
  test:
    name: Fast Tests (PR Gate)
    # Pinned: ubuntu-latest migrated to 26.04 (Playwright/Chromium unsupported).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: cccpeducation/cccp-ci-base@sha256:4722c1bcc71c0343c05257842b774715fc2574ff79182599a29fe8c1361cbeb3

    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # GBL-013 US-4 — the adapter carries no logic: the runtime image provides
      # JDK 25 (no setup-java) and `ci/run.sh fast` runs ktlint + unit tests
      # (same daemon, same gate).
      - name: Lint and run fast tests (unit)
        run: ci/run.sh fast
