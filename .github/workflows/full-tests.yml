name: Full Tests

on:
  push:
    branches: [main, master]
    # Governance/doc-only changes do not affect the plugin build -> no CI proof
    # required (rule "Local = Build, Tests = CI": an unchanged code commit's green
    # run stands). Ignore pure-doc paths.
    paths-ignore:
      - '**/*.adoc'
      - '**/*.md'
      - '.agents/**'
      - '.github/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'fish_example.yaml'
  # Manual trigger — also lets a workflow-only change be validated without a code push.
  workflow_dispatch:

# Cancel superseded runs on the same ref — saves runner-minutes on rapid pushes.
concurrency:
  group: full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── BDD shards (parallel machines) ─────────────────────────────────────────────
  # The monolithic `cucumberTest` aggregate (~14 min, single JVM) is split into
  # EXHAUSTIVE, DISJOINT feature/tag shards, each on its own runner, in a single JVM
  # (keeps the aggregate's efficiency). Guarded by capsule.ci.CapsuleCucumberShardCoverageTest.
  #
  # `binaries` controls what is installed (biggest per-job fixed cost): most shards are
  # pure-domain (NoOp engines) and need neither ffmpeg nor Chromium.
  bdd-shard:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "BDD · kernel"
            task: cucumberTestShardKernel
            binaries: ffmpeg
          - name: "BDD · context-misc"
            task: cucumberTestShardContext
            binaries: ffmpeg
          - name: "BDD · capsule-subtitles"
            task: cucumberTestShardCapsuleSubtitles
            binaries: ffmpeg
          - name: "BDD · capsule-subtitles-burnin"
            task: cucumberTestShardCapsuleSubtitlesBurnIn
            binaries: ffmpeg
          - name: "BDD · capsule-manim"
            task: cucumberTestShardCapsuleManim
            binaries: ffmpeg
          - name: "BDD · capsule-base"
            task: cucumberTestShardCapsuleBase
            binaries: ffmpeg
          - name: "BDD · capsule-core-a"
            task: cucumberTestShardCapsuleCoreA
            binaries: ffmpeg
          - name: "BDD · capsule-core-b"
            task: cucumberTestShardCapsuleCoreB
            binaries: ffmpeg
          - name: "BDD · qc+voice"
            task: cucumberTestShardQc
            binaries: ffmpeg
          - name: "BDD · media"
            task: cucumberTestShardMedia
            binaries: ffmpeg
          - name: "BDD · multi-lang"
            task: cucumberTestShardMultiLang
            binaries: ffmpeg
          - name: "BDD · multi-lang-genA"
            task: cucumberTestShardMultiLangGenA
            binaries: ffmpeg
          - name: "BDD · multi-lang-genB"
            task: cucumberTestShardMultiLangGenB
            binaries: ffmpeg
          - name: "BDD · multi-lang-genC"
            task: cucumberTestShardMultiLangGenC
            binaries: ffmpeg
          - name: "BDD · multi-lang-genD"
            task: cucumberTestShardMultiLangGenD
            binaries: ffmpeg
          - name: "BDD · audio-post"
            task: cucumberTestShardAudioPost
            binaries: ffmpeg
          - name: "BDD · ai+viral"
            task: cucumberTestShardAiViral
            binaries: ffmpeg
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install ffmpeg + espeak
        if: ${{ matrix.binaries == 'ffmpeg' || matrix.binaries == 'ffmpeg+playwright' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak espeak-data

      - name: Setup Playwright (cached Chromium)
        if: ${{ matrix.binaries == 'ffmpeg+playwright' }}
        uses: ./.github/actions/setup-playwright

      - name: Run BDD shard
        run: ./gradlew ${{ matrix.task }} -PrunCucumber
        working-directory: capsule-plugin
        env:
          CI: "true"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.task }}
          path: capsule-plugin/build/reports/

  # ── functionalTest shards (TestKit, real binaries) ──────────────────────────────
  # `functionalTest` (~7.5 min) split into 4 EXHAUSTIVE, DISJOINT class shards via
  # `--tests`. Guarded by capsule.ci.CapsuleCucumberShardCoverageTest.
  functional-shard:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Functional · core+ai"
            tests: "--tests capsule.CapsulePluginFunctionalTest --tests capsule.StrictModeFunctionalTest --tests capsule.ai.CapsuleAiSmokeTestFunctionalTest --tests capsule.podcast.GeneratePodcastFunctionalTest --tests capsule.preview.PreviewExtensionFunctionalTest --tests capsule.transcript.GenerateCapsuleTranscriptFunctionalTest --tests capsule.validation.ValidateCapsuleVideoDurationFunctionalTest"
          - name: "Functional · feed+context"
            tests: "--tests capsule.feed.ExtractSpeakerNotesFunctionalTest --tests capsule.feed.GenerateCapsuleScriptIntegrationFunctionalTest --tests capsule.feed.TranslateAndExtractSpeakerNotesFunctionalTest --tests capsule.feed.TranslateAndGenerateCapsuleVideosFunctionalTest --tests capsule.context.CapsuleAugmentedContextFunctionalTest --tests capsule.context.CollectProvenanceFunctionalTest --tests capsule.context.DocContextFunctionalTest --tests capsule.context.GlossaryContextFunctionalTest --tests capsule.context.ScenarioContextFunctionalTest --tests capsule.pipeline.GenerateCapsuleContentFunctionalTest --tests capsule.pipeline.GenerateCapsuleContentAndVideosFunctionalTest"
          - name: "Functional · media"
            tests: "--tests capsule.AudioPostFunctionalTest --tests capsule.CaptureStrategyFunctionalTest --tests capsule.CaptureTimeoutFunctionalTest --tests capsule.DistributeCapsuleVideoFunctionalTest --tests capsule.FormatConversionFunctionalTest --tests capsule.GenerateCapsuleVideoAllLanguagesFunctionalTest --tests capsule.RemotionCaptureFunctionalTest --tests capsule.RenderSignatureFunctionalTest --tests capsule.TimelineFunctionalTest --tests capsule.publish.PublishCapsuleToYouTubeFunctionalTest"
          - name: "Functional · viral+voice+qc"
            tests: "--tests capsule.viral.GenerateViralCampaignFunctionalTest --tests capsule.viral.NormalizeViralStoryboardFunctionalTest --tests capsule.viral.RenderViralSubtitlesFunctionalTest --tests capsule.viral.RenderViralThumbnailsFunctionalTest --tests capsule.viral.RenderViralVariantsFunctionalTest --tests capsule.viral.ValidateViralCampaignFunctionalTest --tests capsule.voice.SelectBestVoiceTakeFunctionalTest --tests capsule.voice.VerifyCapsuleVoiceFunctionalTest --tests capsule.qc.PreflightCapsuleContentFunctionalTest --tests capsule.qc.RenderQcBoardsFunctionalTest"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install ffmpeg + espeak
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak espeak-data

      - name: Setup Playwright (cached Chromium)
        uses: ./.github/actions/setup-playwright

      - name: Run functional shard
        run: ./gradlew functionalTest ${{ matrix.tests }}
        working-directory: capsule-plugin
        env:
          CI: "true"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-functionalshard-${{ strategy.job-index }}
          path: capsule-plugin/build/reports/

  # ── integration (real binaries) ─────────────────────────────────────────────────
  # `binaries`: @integration + real-render need ffmpeg+Chromium; @manim uses NoOp.
  integration:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Integration · @integration"
            task: cucumberTestShardIntegration
            binaries: ffmpeg+playwright
          - name: "Integration · @manim"
            task: cucumberTestShardManim
            binaries: ffmpeg
          - name: "Integration · @manim-parallel"
            task: cucumberTestShardManimParallel
            binaries: ffmpeg
          - name: "Integration · real render (viral)"
            task: cucumberTestViralRender
            binaries: ffmpeg+playwright
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install ffmpeg + espeak
        if: ${{ matrix.binaries == 'ffmpeg' || matrix.binaries == 'ffmpeg+playwright' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak espeak-data

      - name: Setup Playwright (cached Chromium)
        if: ${{ matrix.binaries == 'ffmpeg+playwright' }}
        uses: ./.github/actions/setup-playwright

      - name: Run integration task
        run: ./gradlew ${{ matrix.task }} -PrunCucumber -PrunPlaywrightTests
        working-directory: capsule-plugin
        env:
          CI: "true"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-integration-${{ strategy.job-index }}
          path: capsule-plugin/build/reports/
