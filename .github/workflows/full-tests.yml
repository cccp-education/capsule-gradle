name: Full Tests

on:
  push:
    branches: [main, master]

jobs:
  full-tests:
    name: Full Test Suite (real binaries + duration validation)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Install ffmpeg + espeak
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak espeak-data

      - name: Install Playwright Chromium
        run: |
          cd capsule-plugin
          ./gradlew --version
          npx playwright install chromium
          npx playwright install-deps chromium

      # Unit + functionalTest (real binaries installed). The full `cucumberTest`
      # Playwright suite is NOT part of this green baseline — it carries a
      # preexisting debt of failing scenarios (see .agents/sessions/139).
      - name: Run tests (unit + functional)
        run: ./gradlew test functionalTest
        working-directory: capsule-plugin
        env:
          CI: "true"

      # `validateCapsuleVideoDuration` is a task the *consumer* project gets when it
      # applies education.cccp.capsule — the plugin project itself never applies it,
      # so invoking it here always failed with "task not found". The video solidity
      # contract is covered by its dedicated Cucumber runner instead.
      - name: Run duration validation scenarios (video solidity contract)
        run: ./gradlew cucumberTestDurationValidation -PrunCucumber
        working-directory: capsule-plugin
        env:
          CI: "true"

      # Dedicated pure-domain BDD runners (no ffmpeg/node). They are opt-in
      # (`additionalTasksInCheck` default false) so `check` stays fast — CI must
      # invoke them explicitly or they are ghost tests (lesson Queens S-269).
      - name: Run viral campaign BDD (CAP-VIRAL domain)
        run: ./gradlew cucumberTestViral -PrunCucumber
        working-directory: capsule-plugin
        env:
          CI: "true"

      # The remaining dedicated pure-domain runners (no ffmpeg/node/network):
      # they are opt-in (`additionalTasksInCheck` default false) so they never
      # run in `check`. Invoking them here closes the ghost-test debt (S-141/S-142
      # — lesson Queens S-269). `cucumberTestIntegration` (real ffmpeg) stays out.
      - name: Run pure-domain BDD runners (ghost-test fix)
        run: >
          ./gradlew
          cucumberTestContext
          cucumberTestContentAndVideos
          cucumberTestArchBoundary
          cucumberTestDistrib
          cucumberTestStrictMode
          cucumberTestDocContext
          cucumberTestScenarioContext
          cucumberTestCaptureStrategy
          cucumberTestFormat
          cucumberTestAudioPost
          cucumberTestProvenance
          cucumberTestGlossaryContext
          cucumberTestTranscript
          cucumberTestMultiLang
          cucumberTestRemotion
          cucumberTestPodcast
          cucumberTestPreview
          cucumberTestChapters
          cucumberTestRemotionAnim
          cucumberTestPr2Coverage
          cucumberTestStoryboardContext
          -PrunCucumber
        working-directory: capsule-plugin
        env:
          CI: "true"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-reports
          path: capsule-plugin/build/reports/