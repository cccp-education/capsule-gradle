name: Full Tests

on:
  push:
    branches: [main, master]
    # Governance/doc-only changes do not affect the plugin build -> no CI proof
    # required (rule "Local = Build, Tests = CI": an unchanged code commit's green
    # run stands). Ignore pure-doc paths to avoid burning ~24 min of Full Tests.
    paths-ignore:
      - '**/*.adoc'
      - '**/*.md'
      - '.agents/**'
      - '.github/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'fish_example.yaml'

jobs:
  full-tests:
    name: Full Test Suite (real binaries + duration validation)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # Gradle cache (wrapper + dependencies + build cache) — shared with the
      # other workflows via the same cache key, so the toolchain and the full
      # dependency graph are never re-downloaded.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install ffmpeg + espeak
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak espeak-data

      # Playwright Chromium is cached via the composite action (key derived from
      # the catalog `playwright` version) — avoids re-downloading the browser
      # (~170 MB) on every run.
      - name: Setup Playwright (cached Chromium)
        uses: ./.github/actions/setup-playwright

      # Unit + functionalTest (real binaries installed). The full `cucumberTest`
      # Playwright suite is NOT part of this green baseline — it carries a
      # preexisting debt of failing scenarios (see .agents/sessions/139).
      - name: Run tests (unit + functional)
        run: ./gradlew test functionalTest
        working-directory: capsule-plugin
        env:
          CI: "true"

      # BDD — the aggregate `CucumberTestRunner` (`cucumberTest`, scoped to it)
      # executes every feature in `src/test/features` through the shared
      # `capsule.scenarios` glue. All step classes are uniquely prefixed (bug S-088),
      # so the former 24 per-feature invocations were redundant: each paid a full
      # test-JVM + Cucumber bootstrap (~45 s) to run a subset the aggregate already
      # covers — ~18 min of the job. The aggregate excludes @integration and
      # @viral-render; the real-render runner (real ffmpeg/ffprobe, installed above)
      # is invoked separately.
      - name: Run BDD (aggregate runner + real render)
        run: ./gradlew cucumberTest cucumberTestViralRender -PrunCucumber
        working-directory: capsule-plugin
        env:
          CI: "true"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-reports
          path: capsule-plugin/build/reports/