# ── Gradle build cache ─────────────────────────────────────────────────────────
# Share the local build cache across the ~24 parallel Full-Tests CI jobs.
# `gradle/actions/setup-gradle` caches the Gradle User Home (which contains
# `caches/build-cache-1`), so enabling the build cache lets unchanged compile
# tasks (Kotlin main/test/functionalTest) be served from cache instead of
# re-running in every job/run.
org.gradle.caching=true
